project_name: "continual_mt_olora"
model_name: "facebook/nllb-200-distilled-600M" # Backbone dịch máy siêu nhẹ
cache_dir: "./models"
learning_rate: 0.0003
r: 16
batch_size: 16         # GPU 16GB của Kaggle nuốt vô tư
fast_dev_run: False    # Tắt chế độ test, train thật sự!
max_epochs: 10         # Train nhiều epoch
num_sample: 1000              # Lấy mẫu 1000 câu để test, không train hết dataset
num_test_sample: 200
orthogonal_loss_weight: 1.0      # Dùng cho olora
num_token_experts: 4               # Dùng cho mole
top_k: 2                          # Dùng cho mole
gamma: 1.0                        # Trọng số L_rkd (mole)
delta: 1.0                        # Trọng số L_kkd (mole)
target_modules: 
  - "q_proj"
  - "v_proj"
  - "fc1"              # THÊM: Mở khóa lớp Fully Connected 1
  - "fc2"              # THÊM: Mở khóa lớp Fully Connected 2
  - "out_proj"         # THÊM: Mở khóa lớp Output Projection
max_length: 128
lora_alpha: 4
precision: '16-mixed' # '16-mixed' | '32-true' | 'bf16-mixed' 
lora_method: 'olora' # olora | oliera | lora
init_strategy: 'pissa' # kaiming | normal | svd | pissa
checkpoint_path: './checkpoints'
micro_batch_size: 4
debug_mode: False